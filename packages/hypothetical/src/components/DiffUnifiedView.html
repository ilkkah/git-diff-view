<div class="unified-diff-view {{#enableWrap}}unified-diff-view-wrap{{/enableWrap}}{{^enableWrap}}unified-diff-view-normal{{/enableWrap}} w-full">
  <style data-select-style>
    {{#selectStyle}}
      #diff-root{{diffFileId}} [data-state="extend"] {user-select: none}
      #diff-root{{diffFileId}} [data-state="hunk"] {user-select: none}
      #diff-root{{diffFileId}} [data-state="widget"] {user-select: none}
    {{/selectStyle}}
  </style>
  <div class="unified-diff-table-wrapper diff-table-scroll-container w-full overflow-x-auto overflow-y-hidden" style="--diff-aside-width: {{asideWidth}}px; font-family: Menlo, Consolas, monospace; font-size: var(--diff-font-size);">
    <table class="unified-diff-table w-full border-collapse border-spacing-0 {{#enableWrap}}table-fixed{{/enableWrap}}">
      <colgroup>
        <col class="unified-diff-table-num-col" />
        <col class="unified-diff-table-content-col" />
      </colgroup>
      <thead class="hidden">
        <tr>
          <th scope="col">line number</th>
          <th scope="col">line content</th>
        </tr>
      </thead>
      <tbody class="diff-table-body leading-[1.6]" data-onmousedown="handleMouseDown">
        {{#lines}}
          {{{hunkLine}}}
          {{{contentLine}}}
          {{{widgetLine}}}
          {{{extendLine}}}
        {{/lines}}
        {{{finalHunkLine}}}
      </tbody>
    </table>
  </div>
</div>
